<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈 · 도담테크산업 IT 운영 포털 (시뮬레이션)</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sim-banner" role="note">
    <strong>시뮬레이션</strong>
    가상 회사 ‘도담테크산업’의 데모입니다. 실제 회사·인물·시스템과 관계없으며, 데이터는 매일 04:30(KST)에 초기화됩니다.
  </div>

  <header class="topbar">
    <div class="brand">도담테크산업 <span>IT 운영 포털</span></div>
    <nav class="mainnav" aria-label="주 메뉴">
      <a href="/app" data-nav="home">홈</a>
      <a href="/tickets" data-nav="tickets">헬프데스크</a>
      <a href="/faq" data-nav="faq">FAQ</a>
    </nav>
    <div class="user">
      <span id="user-info" class="muted">불러오는 중…</span>
      <button type="button" id="logout" class="link-button">로그아웃</button>
    </div>
  </header>

  <main class="content">
    <section>
      <h2>회사 개요</h2>
      <p id="company-line" class="muted"></p>
      <div id="sites" class="site-grid"></div>
      <p id="last-reset" class="muted small"></p>
    </section>
    <p id="app-error" class="error" role="alert" hidden></p>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
