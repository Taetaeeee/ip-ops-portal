<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT 자산 · 도담테크산업 IT 운영 포털 (시뮬레이션)</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sim-banner" role="note">
    <strong>시뮬레이션</strong>
    가상 회사 ‘도담테크산업’의 데모입니다. 실제 회사·인물·시스템과 관계없으며, 데이터는 매일 04:30(KST)에 초기화됩니다.
  </div>

  <!-- 상단 메뉴는 js/common.js 가 그린다 (메뉴 정의를 한 곳에 모으기 위해) -->
  <header class="topbar" id="app-header"></header>

  <main class="content">
    <div class="page-head">
      <h2>IT 자산</h2>
      <a class="button" href="/licenses">라이선스 현황</a>
    </div>

    <form id="filters" class="filters">
      <label>종류 <select name="type"></select></label>
      <label>상태 <select name="status"></select></label>
      <label class="grow">검색 <input type="search" name="q" maxlength="100" placeholder="자산 번호·모델·시리얼·사용자·위치"></label>
      <button type="submit" class="button">조회</button>
    </form>

    <p id="list-error" class="error" role="alert" hidden></p>
    <p id="count" class="muted"></p>
    <div class="table-wrap">
      <table id="asset-table" class="tickets"></table>
    </div>
  </main>

  <script type="module" src="/js/assets.js"></script>
</body>
</html>
