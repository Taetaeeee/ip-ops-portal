<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도담테크산업 IT 운영 포털 (시뮬레이션)</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sim-banner" role="note">
    <strong>시뮬레이션</strong>
    가상 회사 ‘도담테크산업’의 데모입니다. 실제 회사·인물·시스템과 관계없으며, 데이터는 매일 04:30(KST)에 초기화됩니다.
  </div>

  <div class="login-wrap">
    <main class="login">
      <div class="brand">
        <span class="brand-logo"><svg class="icon" aria-hidden="true"><use href="/icons.svg#logo"/></svg></span>
        <span class="brand-text"><strong>IT 운영 포털</strong><small>도담테크산업 · IT Operations Portal</small></span>
      </div>
      <h1>데모로 둘러보기</h1>
      <p class="muted">데모 계정(페르소나)을 골라 들어가세요. 비밀번호는 없습니다.</p>

      <div class="persona-list">
        <button type="button" class="persona" data-persona="it_admin">
          <span class="kpi-icon"><svg class="icon" aria-hidden="true"><use href="/icons.svg#shield"/></svg></span>
          <span class="persona-text">
            <strong>IT 담당자</strong>
            <span>경영지원팀 · 전산·IT 운영 담당. 헬프데스크 처리, 자산·라이선스, 계정, 입·퇴사</span>
          </span>
        </button>
        <button type="button" class="persona" data-persona="employee">
          <span class="kpi-icon ok"><svg class="icon" aria-hidden="true"><use href="/icons.svg#users"/></svg></span>
          <span class="persona-text">
            <strong>일반 직원</strong>
            <span>영업팀 직원. 요청 등록, 내 요청 확인, FAQ</span>
          </span>
        </button>
      </div>

      <p id="login-error" class="error" role="alert" hidden></p>
    </main>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
