<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>라이선스 · 도담테크산업 IT 운영 포털 (시뮬레이션)</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="sim-banner" role="note">
    <strong>시뮬레이션</strong>
    가상 회사 ‘도담테크산업’의 데모입니다. 실제 회사·인물·시스템과 관계없으며, 데이터는 매일 04:30(KST)에 초기화됩니다.
  </div>

  <header class="topbar">
    <div class="brand">도담테크산업 <span>IT 운영 포털</span></div>
    <nav class="mainnav" aria-label="주 메뉴">
      <a href="/app" data-nav="home">홈</a>
      <a href="/tickets" data-nav="tickets">헬프데스크</a>
      <a href="/faq" data-nav="faq">FAQ</a>
      <a href="/assets" data-nav="assets" data-it-only hidden>자산</a>
      <a href="/licenses" data-nav="licenses" data-it-only hidden>라이선스</a>
      <a href="/directory" data-nav="directory" data-it-only hidden>디렉터리</a>
    </nav>
    <div class="user">
      <span id="user-info" class="muted">불러오는 중…</span>
      <button type="button" id="logout" class="link-button">로그아웃</button>
    </div>
  </header>

  <main class="content">
    <div class="page-head">
      <h2>라이선스 현황</h2>
      <span id="as-of" class="muted small"></span>
    </div>
    <p class="muted small">
      설치 수 = 해당 소프트웨어가 설치된 자산 수 (폐기 자산 제외, 재고·수리 자산 포함).
      만료 <span id="warn-days">30</span>일 전부터 경고합니다. 소프트웨어·계약 업체 이름은 모두 가상입니다.
    </p>
    <p id="page-error" class="error" role="alert" hidden></p>

    <div id="summary" class="summary-grid" aria-live="polite"></div>

    <section class="card">
      <h3>라이선스별 보유 대 설치</h3>
      <div class="table-wrap plain"><table id="license-table"></table></div>
    </section>

    <section class="card" id="unauth-section">
      <h3>비인가 소프트웨어 <span class="muted small">(허용 목록에 없는 프로그램)</span></h3>
      <div id="unauthorized" class="stack"></div>
    </section>
  </main>

  <script type="module" src="/js/licenses.js"></script>
</body>
</html>
